  </defs>
  <rect width="600" height="380" fill="url(#bg5)" rx="16"/>
  <!-- Manual and Archiving mockup -->
  <rect x="40" y="35" width="520" height="310" rx="10" fill="#ffffff" stroke="#fef08a" stroke-width="2"/>
  <rect x="40" y="35" width="520" height="38" rx="10" fill="url(#headerGrad5)"/>
  <circle cx="65" cy="54" r="5" fill="#fecaca"/>
  <circle cx="82" cy="54" r="5" fill="#fef08a"/>
  <circle cx="99" cy="54" r="5" fill="#bbf7d0"/>
  <text x="120" y="59" fill="#ffffff" font-size="13" font-family="sans-serif" font-weight="600">📁 Customer Support Manual & Doc Archive</text>

