  <text x="90" y="222" fill="#292524" font-size="13" font-weight="bold">📌 업무 프로세스 개선 성과</text>
  
  <rect x="90" y="240" width="12" height="12" rx="3" fill="#ca8a04"/>
  <text x="110" y="251" fill="#44403c" font-size="11">고객 문의 평균 처리 소요 시간 단축 (기존 45분 ➔ 15분 이내 완료)</text>

  <rect x="90" y="265" width="12" height="12" rx="3" fill="#ca8a04"/>
