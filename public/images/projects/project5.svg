  <text x="310" y="145" fill="#a16207" font-size="10" text-anchor="middle">원스톱 응대 스크립트</text>

  <line x1="375" y1="132" x2="410" y2="132" stroke="#ca8a04" stroke-width="2"/>
  <polygon points="410,128 420,132 410,136" fill="#ca8a04"/>

  <rect x="420" y="90" width="115" height="85" rx="8" fill="#fef9c3" stroke="#eab308"/>
