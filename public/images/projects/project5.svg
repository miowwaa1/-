  <text x="135" y="145" fill="#a16207" font-size="10" text-anchor="middle">유형별 우선순위 지정</text>

  <line x1="200" y1="132" x2="235" y2="132" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
